<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Navy background circle -->
  <circle cx="16" cy="16" r="16" fill="#0A1628"/>
  <!-- King penguin silhouette in glacier teal -->
  <!-- Body -->
  <ellipse cx="16" cy="20" rx="6" ry="7.5" fill="#1B8A9A"/>
  <!-- Head -->
  <circle cx="16" cy="9.5" r="4.5" fill="#1B8A9A"/>
  <!-- White belly -->
  <ellipse cx="16" cy="20.5" rx="3.5" ry="5.5" fill="#F5F7F9" opacity="0.9"/>
  <!-- White face patch -->
  <ellipse cx="16" cy="9.8" rx="2.5" ry="2.8" fill="#F5F7F9" opacity="0.85"/>
  <!-- Amber ear patches -->
  <ellipse cx="12.8" cy="9" rx="1.2" ry="1.8" fill="#D4963A" opacity="0.9"/>
  <ellipse cx="19.2" cy="9" rx="1.2" ry="1.8" fill="#D4963A" opacity="0.9"/>
  <!-- Left flipper -->
  <ellipse cx="9.5" cy="19" rx="2.2" ry="5.5" fill="#1B8A9A" transform="rotate(-12 9.5 19)"/>
  <!-- Right flipper -->
  <ellipse cx="22.5" cy="19" rx="2.2" ry="5.5" fill="#1B8A9A" transform="rotate(12 22.5 19)"/>
  <!-- Feet -->
  <ellipse cx="14" cy="28.5" rx="2.2" ry="1.2" fill="#1B8A9A"/>
  <ellipse cx="18" cy="28.5" rx="2.2" ry="1.2" fill="#1B8A9A"/>
  <!-- Beak -->
  <path d="M14.5 11.5 L16 13.5 L17.5 11.5 Z" fill="#D4963A"/>
</svg>
