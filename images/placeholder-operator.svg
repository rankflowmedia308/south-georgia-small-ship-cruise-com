<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300">
  <defs>
    <linearGradient id="opGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#122040"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="300" fill="url(#opGrad)"/>

  <!-- Subtle horizon glow -->
  <ellipse cx="410" cy="180" rx="300" ry="80" fill="#1B8A9A" opacity="0.05"/>

  <!-- Ocean / water base -->
  <rect x="0" y="210" width="820" height="90" fill="#091420" opacity="0.6"/>

  <!-- Ship silhouette — hull -->
  <rect x="260" y="168" width="300" height="42" rx="4" fill="#1B8A9A" opacity="0.85"/>
  <!-- Hull bottom curve -->
  <path d="M 260 205 Q 280 220 310 222 L 510 222 Q 540 220 560 205 Z" fill="#1B8A9A" opacity="0.85"/>

  <!-- Superstructure deck 1 -->
  <rect x="300" y="140" width="200" height="32" rx="3" fill="#1B8A9A" opacity="0.9"/>

  <!-- Superstructure deck 2 / bridge -->
  <rect x="330" y="116" width="140" height="28" rx="3" fill="#1B8A9A" opacity="0.95"/>

  <!-- Bridge windows -->
  <rect x="342" y="122" width="12" height="10" rx="2" fill="#0A1628" opacity="0.7"/>
  <rect x="360" y="122" width="12" height="10" rx="2" fill="#0A1628" opacity="0.7"/>
  <rect x="378" y="122" width="12" height="10" rx="2" fill="#0A1628" opacity="0.7"/>
  <rect x="396" y="122" width="12" height="10" rx="2" fill="#0A1628" opacity="0.7"/>
  <rect x="414" y="122" width="12" height="10" rx="2" fill="#0A1628" opacity="0.7"/>
  <rect x="432" y="122" width="12" height="10" rx="2" fill="#0A1628" opacity="0.7"/>
  <rect x="450" y="122" width="12" height="10" rx="2" fill="#0A1628" opacity="0.7"/>

  <!-- Deck 1 windows row -->
  <rect x="312" y="148" width="10" height="8" rx="1" fill="#0A1628" opacity="0.5"/>
  <rect x="330" y="148" width="10" height="8" rx="1" fill="#0A1628" opacity="0.5"/>
  <rect x="348" y="148" width="10" height="8" rx="1" fill="#0A1628" opacity="0.5"/>
  <rect x="366" y="148" width="10" height="8" rx="1" fill="#0A1628" opacity="0.5"/>
  <rect x="384" y="148" width="10" height="8" rx="1" fill="#0A1628" opacity="0.5"/>
  <rect x="402" y="148" width="10" height="8" rx="1" fill="#0A1628" opacity="0.5"/>
  <rect x="420" y="148" width="10" height="8" rx="1" fill="#0A1628" opacity="0.5"/>
  <rect x="438" y="148" width="10" height="8" rx="1" fill="#0A1628" opacity="0.5"/>
  <rect x="456" y="148" width="10" height="8" rx="1" fill="#0A1628" opacity="0.5"/>
  <rect x="474" y="148" width="10" height="8" rx="1" fill="#0A1628" opacity="0.5"/>

  <!-- Funnel -->
  <rect x="378" y="96" width="30" height="24" rx="4" fill="#D4963A" opacity="0.75"/>
  <!-- Funnel top cap -->
  <rect x="374" y="92" width="38" height="8" rx="3" fill="#D4963A" opacity="0.6"/>

  <!-- Mast -->
  <line x1="410" y1="56" x2="410" y2="116" stroke="#1B8A9A" stroke-width="2" opacity="0.5"/>
  <!-- Radar arm -->
  <line x1="390" y1="72" x2="430" y2="72" stroke="#1B8A9A" stroke-width="1.5" opacity="0.4"/>

  <!-- Water reflection lines -->
  <line x1="300" y1="230" x2="520" y2="230" stroke="#1B8A9A" stroke-width="1" opacity="0.15"/>
  <line x1="320" y1="238" x2="500" y2="238" stroke="#1B8A9A" stroke-width="0.8" opacity="0.10"/>
  <line x1="340" y1="246" x2="480" y2="246" stroke="#1B8A9A" stroke-width="0.6" opacity="0.08"/>

  <!-- Label text -->
  <text
    x="410"
    y="278"
    text-anchor="middle"
    font-family="'DM Sans', 'Helvetica Neue', sans-serif"
    font-size="14"
    font-weight="400"
    letter-spacing="1.5"
    fill="#F5F7F9"
    opacity="0.4">Operator Photo</text>
</svg>
