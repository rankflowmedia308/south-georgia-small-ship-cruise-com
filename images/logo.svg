<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 44" width="188" height="44">
  <!-- Penguin icon in 44x44 area -->
  <!-- Body -->
  <ellipse cx="22" cy="28" rx="10" ry="12" fill="#1B8A9A"/>
  <!-- Head -->
  <circle cx="22" cy="14" r="7" fill="#1B8A9A"/>
  <!-- White chest patch -->
  <ellipse cx="22" cy="30" rx="5.5" ry="8" fill="#F5F7F9"/>
  <!-- Eye -->
  <circle cx="24.5" cy="12.5" r="1.5" fill="#F5F7F9"/>
  <!-- Left flipper -->
  <path d="M 12 20 Q 6 22 8 28 Q 12 24 14 26 Z" fill="#0A1628"/>
  <!-- Right flipper -->
  <path d="M 32 20 Q 38 22 36 28 Q 32 24 30 26 Z" fill="#0A1628"/>
  <!-- Beak -->
  <path d="M 20.5 17 L 22 20 L 23.5 17 Z" fill="#D4963A"/>

  <!-- Wordmark: SOUTH GEORGIA -->
  <text
    x="52"
    y="18"
    font-family="'DM Sans', 'Helvetica Neue', sans-serif"
    font-size="11"
    font-weight="600"
    letter-spacing="2"
    fill="#F5F7F9">SOUTH GEORGIA</text>

  <!-- Wordmark: CRUISE GUIDE -->
  <text
    x="52"
    y="31"
    font-family="'DM Sans', 'Helvetica Neue', sans-serif"
    font-size="8.5"
    font-weight="400"
    letter-spacing="1.5"
    fill="#1B8A9A">CRUISE GUIDE</text>
</svg>
